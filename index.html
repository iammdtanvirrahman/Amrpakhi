<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samira — My Universe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="stars"></div>

  <div class="sun"></div>
  <div class="moon"></div>

  <div class="earth-orbit">
    <div class="earth"></div>
  </div>

  <div class="neptune-container">
    <div class="neptune-ring"></div>
    <div class="neptune"></div>
  </div>

  <main class="hero">

    <section class="left-content">
      <div class="tag">PRIVATE COSMIC EXPERIENCE</div>

      <h1>
        তোমাকে ভালোবাসা মানে<br>
        <span>একটা সম্পূর্ণ মহাবিশ্বকে অনুভব করা</span>
      </h1>

      <p>
        এই ওয়েবসাইটটা শুধু একটা পেজ না।
        এটা এমন একটা নীরব মহাকাশ যেখানে প্রতিটা তারা, প্রতিটা আলো আর প্রতিটা গ্রহ তোমাকেই মনে করিয়ে দেয়।
      </p>

      <button id="revealBtn">Reveal My Heart ✨</button>
    </section>

    <section class="right-content">
      <div class="photo-card">
        <img src="samira.jpg" alt="Samira">

        <div class="overlay">
          <div class="overlay-content">
            <div class="small">FOR MY PERSON</div>
            <h2>Samira</h2>
            <p id="floatingText">তুমি আমার জীবনের সবচেয়ে সুন্দর অনুভূতি।</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <section class="message-panel hidden" id="messagePanel">
    <div class="panel-inner">
      <div class="panel-label">CONFIDENTIAL MESSAGE</div>
      <p id="typedText"></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
