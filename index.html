<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Samira 💙</title>
<link rel="icon" type="image/png" href="1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-content">
      <div class="planet-loader"></div>
      <h2>Loading Your Universe...</h2>
      <p id="loadingText">Preparing memories ✨</p>
    </div>
  </div>

  <div id="stars"></div>

  <div class="sun"></div>
  <div class="moon"></div>

  <div class="earth-orbit">
    <div class="earth"></div>
  </div>

  <div class="neptune-wrap">
    <div class="neptune-ring"></div>
    <div class="neptune"></div>
  </div>

  <main class="hero">
    <div class="cinema-card">

      <img id="slideImage" src="1.jpg" alt="Samira">

      <div class="overlay">
        <div class="overlay-content">

          <div class="top-label">NOW PLAYING • MY HEART</div>

          <h1 id="lyricText">
এ যেন সহজ স্বীকারোক্তি
আমি যুগান্তরী নই
          </h1>

          <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <div class="bottom-row">
            <span>For Samira 💙</span>
            <span id="counter">01 / 06</span>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
