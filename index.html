<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Samira ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stars"></div>

  <div class="moon">
    <div class="crater crater1"></div>
    <div class="crater crater2"></div>
    <div class="crater crater3"></div>
  </div>

  <main class="container">

    <section class="hero-card">
      <div class="heart">💖</div>
      <h1>সামিরা</h1>
      <p class="subtitle">আমার মায়াবতী রাজকন্যা 🌙✨</p>

      <div class="typing-box">
        <p id="typing"></p>
      </div>

      <button id="loveBtn">আমাকে ছুঁয়ে দেখো 💕</button>
    </section>

    <section class="messages">
      <h2>তোমার জন্য কিছু কথা</h2>

      <div class="message-card">
        <p>তুমি আমার রাতের আকাশের সবচেয়ে উজ্জ্বল তারা। ⭐</p>
      </div>

      <div class="message-card">
        <p>তোমার হাসি দেখলেই পৃথিবীটা আরও সুন্দর লাগে। 😊</p>
      </div>

      <div class="message-card">
        <p>চাঁদটা যতই সুন্দর হোক, তোমার চোখের কাছে হার মেনে যায়। 🌕❤️</p>
      </div>
    </section>

    <section class="footer-love">
      <p>ইতি, কেবল তোমারই <strong>তানভীর</strong> 💌</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
